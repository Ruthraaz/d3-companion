<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Só arquivos do site e ícones do servidor da Blizzard. A build fica no endereço
       (depois do #), que o navegador nunca manda pro servidor.
       Nuvem (opcional, nuvem.js): o arquivo exato do supabase-js no jsDelivr (com SRI) e, depois
       do "python ferramentas/nuvem.py", o endereço do projeto Supabase no connect-src. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js; style-src 'self'; img-src 'self' https://blzmedia-a.akamaihd.net; connect-src 'self' https://vemcxjgyedafqsgwbuep.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title data-t>Montar build — D3 Companion</title>
  <meta data-t name="description" content="Monte sua build de Diablo III com os itens, gemas, cubo, habilidades e paragon do jogo, e leve pro D3 Companion com um link.">
  <link rel="canonical" href="https://ruthraaz.github.io/d3-companion/montar.html">
  <!-- Prévia do link (WhatsApp, Discord, redes): imagem própria, sem arte do jogo. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="D3 Companion">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="pt_BR">
  <meta data-t property="og:title" content="Montar build de Diablo III — D3 Companion">
  <meta data-t property="og:description" content="Monte sua build com os itens, gemas, cubo de Kanai, habilidades e paragon do jogo, e veja o que cada item faz. Grátis, sem cadastro.">
  <meta property="og:url" content="https://ruthraaz.github.io/d3-companion/montar.html">
  <meta property="og:image" content="https://ruthraaz.github.io/d3-companion/img/compartilhar.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta data-t property="og:image:alt" content="D3 Companion: saiba na hora se o item serve na sua build">
  <meta name="twitter:card" content="summary_large_image">
  <meta data-t name="twitter:title" content="Montar build de Diablo III — D3 Companion">
  <meta data-t name="twitter:description" content="Monte sua build com os itens, gemas, cubo de Kanai, habilidades e paragon do jogo, e veja o que cada item faz. Grátis, sem cadastro.">
  <meta name="twitter:image" content="https://ruthraaz.github.io/d3-companion/img/compartilhar.png">
  <meta name="theme-color" content="#111215">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- app.css (= src/web/estilo.css), montar.css, montar.js, dica.js e idioma.js são cópias do app; um teste confere. -->
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="montar.css">
  <link rel="stylesheet" href="nuvem.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="./">
      <span class="marca-runa" aria-hidden="true"></span>
      <span class="marca-nome">D3 Companion</span>
    </a>
    <nav class="abas">
      <a class="aba" href="./" data-t>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>
        Início</a>
      <a class="aba ativa" href="montar.html" aria-current="page" data-t>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5l6 6-9 9-3-3-3 3-2-2 3-3-3-3zM16 8l-6 6"/></svg>
        Montar build</a>
      <a class="aba" href="./#baixar" data-t>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>
        Baixar o app</a>
    </nav>
    <div class="topo-direita">
      <div class="estado">
        <span class="estado-ponto"></span>
        <span class="estado-texto" data-t>No site: monta a build; quem avalia o item é o app</span>
      </div>
      <button type="button" class="trocar-idioma" data-trocar-idioma data-t title="Idioma">English</button>
    </div>
  </header>

  <main data-montador="site">
    <section class="painel ativo">
      <!-- Entrar / Salvar na nuvem / Minhas builds (nuvem.js). Escondido sem o config-nuvem.js. -->
      <section class="nuvem" data-nuvem hidden></section>
      <p class="carregando-jogo" data-m="carregando" data-t>Carregando os itens do jogo…</p>
      <div class="faixa-classes" data-m="classes-builds" role="tablist"></div>
      <div class="cabeca-build" data-m="cabeca-build"></div>
      <p class="avaliando" data-m="avaliando" role="status"></p>

      <div class="builds-corpo" data-m="builds-corpo" hidden>
        <nav class="sub-abas" role="tablist">
          <button class="sub-aba ativa" data-sub="equipamento" role="tab" data-t>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l1 4-5 3-5-3zM7 7v6l5 8 5-8V7"/></svg>
            Equipamento</button>
          <button class="sub-aba" data-sub="habilidades" role="tab" data-t>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
            Habilidades</button>
          <button class="sub-aba" data-sub="paragon" role="tab" data-t>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5-6.5-4.5L5.5 21l2-7.5L2 9h7z"/></svg>
            Paragon</button>
        </nav>
        <div class="builds-grade">
          <div class="coluna-build">
            <div class="sub-painel ativo" data-m="sub-equipamento">
              <div class="boneco">
                <div class="coluna-equip" data-m="equip-esq"></div>
                <div class="centro-equip">
                  <div class="roda" data-m="roda"></div>
                  <div class="extra">
                    <h3 class="extra-titulo" data-t>Gemas lendárias</h3>
                    <div class="fila-icones" data-m="gemas"></div>
                  </div>
                </div>
                <div class="coluna-equip direita" data-m="equip-dir"></div>
              </div>
              <p class="legenda">
                <span class="leg leg-item" data-t>item escolhido</span>
                <span class="leg leg-livre" data-t>qualquer item com os afixos</span>
                <span class="leg leg-geral" data-t>ainda vazio</span>
              </p>
              <section class="cubo-kanai">
                <h3 class="faixa-titulo"><span data-t>Cubo de Kanai</span></h3>
                <div class="cubo-cartas" data-m="cubo"></div>
              </section>
            </div>
            <div class="sub-painel" data-m="sub-habilidades">
              <div class="janela-jogo" data-m="janela-habilidades"></div>
            </div>
            <div class="sub-painel" data-m="sub-paragon">
              <div class="paragon" data-m="paragon"></div>
            </div>
          </div>
          <aside class="detalhe"><div class="detalhe-fixo" data-m="detalhe"></div></aside>
        </div>
      </div>
    </section>
  </main>

  <script src="idioma.js"></script>
  <script src="dica.js"></script>
  <script src="montar.js"></script>
  <script src="config-nuvem.js"></script>
  <script src="nuvem.js"></script>
</body>
</html>
